[platformio]
default_envs = cyd_st7789

[env]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
lib_deps =
    bodmer/TFT_eSPI@2.5.43
    bblanchon/ArduinoJson@6.21.5
    links2004/WebSockets@2.7.3
    https://github.com/PaulStoffregen/XPT2046_Touchscreen/archive/refs/tags/v1.4.zip
monitor_speed = 115200
upload_speed = 115200
board_build.flash_mode = dio
board_build.partitions = min_spiffs.csv
extra_scripts = pre:scripts/configure_transport.py
build_flags =
    -D USER_SETUP_LOADED
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D SPI_FREQUENCY=27000000
    -D SPI_READ_FREQUENCY=16000000
    -D USE_HSPI_PORT
    -D WEBSOCKETS_NETWORK_TYPE=NETWORK_CUSTOM

[env:cyd_st7789]
build_flags =
    ${env.build_flags}
    -D ST7789_DRIVER
    -D TFT_INVERSION_OFF
    -D TFT_RGB_ORDER=TFT_BGR
    -D DEFAULT_INVERT=0

[env:cyd_ili9341]
build_flags =
    ${env.build_flags}
    -D ILI9341_2_DRIVER
    -D DEFAULT_INVERT=0
